name: Python tests and syntax
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install FFmpeg and Arabic fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Docker entrypoint syntax
        run: sh -n docker-entrypoint.sh
      - name: Check Python syntax
        run: python -m compileall -q app tests
      - name: Run tests
        env:
          CLOUD_VISION_ENABLED: '0'
        run: python -m pytest -q
